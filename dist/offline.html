<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172033">
  <title>Offline | SPAS1 Hybrid</title>
  <link rel="icon" type="image/png" href="/assets/pwa-icon-192.png">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #172033; color: #f8fafc; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
    main { max-width: 28rem; text-align: center; }
    img { width: 5rem; height: 5rem; border-radius: 1rem; }
    h1 { margin: 1.25rem 0 .5rem; font-size: 1.5rem; }
    p { color: #cbd5e1; line-height: 1.6; }
    button { margin-top: 1rem; border: 0; border-radius: .75rem; background: #4f46e5; color: white; padding: .8rem 1.25rem; font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/pwa-icon-192.png" alt="">
    <h1>SPAS1 Hybrid sedang offline</h1>
    <p>Hubungkan perangkat ke internet untuk membuka modul dan menyinkronkan data SPPG.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
